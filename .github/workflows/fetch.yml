# Readar's fetch worker for everyone (PLAN.md §11): one pass over every followed source, every
# 15 minutes (free: the repo is public). A pass also answers the app's "fetch now" requests made since the last one.
# Secrets (repo Settings → Secrets and variables → Actions): DATABASE_URL, optional YOUTUBE_API_KEY.
name: Fetch articles

on:
  schedule:
    # Off the quarter hours, when GitHub's scheduler is busiest and runs start late.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Never two passes at once; a run that starts while one is going waits for it.
concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @readar/worker...
      - run: pnpm worker:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
