<!-- Readar sign-in email. Paste into Supabase → Authentication → Emails, in both
     "Confirm signup" (new accounts) and "Magic link" (existing accounts). Subject: Your Readar code -->
<div
  style="
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px;
    color: #111827;
  "
>
  <h2 style="margin: 0 0 8px; font-size: 20px">Sign in to Readar</h2>
  <p style="margin: 0 0 16px; color: #4b5563">Enter this code in Readar:</p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: 700; letter-spacing: 6px">
    {{ .Token }}
  </p>
  <p style="margin: 0 0 16px; color: #4b5563">Or open Readar from this link:</p>
  <p style="margin: 0 0 24px">
    <a
      href="{{ .SiteURL }}/auth?token_hash={{ .TokenHash }}&type=email"
      style="
        display: inline-block;
        background: #111827;
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      "
      >Sign in to Readar</a
    >
  </p>
  <p style="margin: 0; font-size: 12px; color: #9ca3af">
    The code and the link work once and expire in an hour. Didn't ask for this? Ignore this email.
  </p>
</div>
